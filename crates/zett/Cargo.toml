[package]
name = "zett"
description = "An editor you live in"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zett-core.workspace = true
loro.workspace = true
zett-edit.workspace = true
zett-script.workspace = true
zett-tui.workspace = true
zett-lsp = { path = "../zett-lsp" }
regex = "1"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "parsing", "regex-fancy", "yaml-load"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
ropey.workspace = true
serde_json = "1"
zett-ycm.workspace = true
alacritty_terminal = "0.26"
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

[package]
name = "zett-tui"
description = "zett in the terminal: the code editor, same engine as the window"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zett-core = { workspace = true, features = ["fs"] }
zett-ycm.workspace = true
zett-edit.workspace = true
zett-script.workspace = true
zett-lsp = { path = "../zett-lsp" }
ratatui = "0.29"
pulldown-cmark = { version = "0.13", default-features = false }
serde_json = "1"
fancy-regex = "0.16"
tree-sitter = "0.25"
libloading = "0.8"
streaming-iterator = "0.1"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "parsing", "regex-fancy", "yaml-load"] }

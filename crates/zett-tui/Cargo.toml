[package]
name = "zett-tui"
description = "zett in the terminal: the code editor, same engine as the window"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zett-core = { workspace = true, features = ["fs"] }
zett-edit.workspace = true
zett-script.workspace = true
ratatui = "0.29"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "parsing", "regex-fancy"] }

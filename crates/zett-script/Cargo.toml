[package]
name = "zett-script"
description = "zett's Lua engine: commands, keymaps, hooks, init.lua and plugins"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wasmi = "2"
zett-core = { workspace = true, features = ["fs"] }
zett-edit.workspace = true
mlua = { version = "0.10", features = ["lua54", "vendored"] }

[dev-dependencies]
wat = "1"

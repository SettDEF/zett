[workspace]
resolver = "3"
members = ["crates/zett-core", "crates/zett-edit", "crates/zett-script", "crates/zett-lsp", "crates/zett-tui", "crates/zett", "crates/zett-ycm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ropey = "1.6"
loro = "1.16"
zett-core = { path = "crates/zett-core" }
zett-edit = { path = "crates/zett-edit" }
zett-script = { path = "crates/zett-script" }
zett-tui = { path = "crates/zett-tui" }
zett-ycm = { path = "crates/zett-ycm" }
